<style>
  html, body { margin: 0; height: 100%; background: #17120e; overflow: hidden; }
  #bgfill { position: fixed; inset: -6%; z-index: 0; background-size: cover; background-position: center; filter: blur(22px) brightness(.55); opacity: 0; transition: opacity .5s; pointer-events: none; }   /* ai lati del gioco: l'arte del livello sfocata invece del nero */
  #game { position: relative; z-index: 1; width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #introWrap { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; background: #000; font-family: Georgia, serif; }
  #vbox { position: relative; width: min(100vw, calc(100vh * 16 / 9)); width: min(100vw, calc(100dvh * 16 / 9)); aspect-ratio: 16 / 9; }
  #introVideo { width: 100%; height: 100%; display: block; background: #000; }
  /* ===== MENU DEL LIBRO (assets/menu.jpg): immagine + aree cliccabili in % dell'immagine 2576x1438 ===== */
  #menu { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .7s ease; --u: 12px; font-family: Georgia, serif; }
  #menu.on { opacity: 1; pointer-events: auto; }
  #menuImg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: fill; user-select: none; -webkit-user-drag: none; }
  .mi { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: 14px; transition: background .2s, box-shadow .2s; color: #1a1411; font: inherit; }
  .mi:hover, .mi:focus-visible { background: rgba(110,160,255,.16); box-shadow: 0 0 28px rgba(110,160,255,.55); outline: none; }
  .mi::after { content: ''; position: absolute; left: 5%; right: 5%; bottom: 7%; height: 7%; border-radius: 50%; transform: scaleX(0); transform-origin: left center; transition: transform .28s ease;
    background: linear-gradient(90deg, rgba(27,47,224,0) 0%, rgba(27,47,224,.9) 7%, rgba(20,34,170,.95) 50%, rgba(27,47,224,.9) 93%, rgba(27,47,224,0) 100%); filter: blur(.4px); pointer-events: none; }   /* come un tratto di penna appena disegnato */
  .mi:hover::after, .mi:focus-visible::after, .mi.sel::after { transform: scaleX(1); }
  .mi.sel { background: rgba(110,160,255,.16); box-shadow: 0 0 28px rgba(110,160,255,.55); }
  .mi.dim::after { display: none; }
  .clabel { position: absolute; text-align: center; pointer-events: none; font: italic 500 calc(var(--u) * 1.45)/1 'Playfair Display', Georgia, serif; color: rgba(20,34,170,.9); letter-spacing: .04em; }
  .mi.dim { opacity: .55; }
  .mi.txt { font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; text-transform: uppercase; letter-spacing: .03em; font-size: calc(var(--u) * 3.0); line-height: 1; text-shadow: 0 0 1px rgba(26,20,17,.35); white-space: nowrap; }
  /* pannello sulla pagina destra del libro (opzioni, spiegazioni, livelli) */
  #panel { position: absolute; left: 50.6%; top: 13.2%; width: 34.2%; height: 70.5%; display: none; box-sizing: border-box; padding: calc(var(--u) * 2) calc(var(--u) * 2.2);
    color: #2a1d14; border-radius: 6px; overflow: auto;
    background: radial-gradient(ellipse at 50% 40%, #f7ecd3 0%, #efdfbd 70%, #e3cfa4 100%);
    box-shadow: inset 0 0 calc(var(--u) * 3) rgba(150,100,50,.35), 0 6px 22px rgba(0,0,0,.35); }
  #panel.open { display: block; animation: pin .35s ease; }
  @keyframes pin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #panel h2 { margin: 0 0 calc(var(--u) * .8); font: italic 600 calc(var(--u) * 2.5)/1.1 'Playfair Display', Georgia, serif; color: #15217a; letter-spacing: .02em; text-align: center; }
  #panel .rule { height: 3px; margin: 0 auto calc(var(--u) * 1.1); width: 60%; background: linear-gradient(90deg, transparent, #1b3fe0, transparent); border-radius: 3px; opacity: .8; }
  #panel .row { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 1); margin: calc(var(--u) * .75) 0; font-size: calc(var(--u) * 1.45); }
  #panel .row.key span.d { flex: 1; text-align: right; font-style: italic; }
  #panel kbd { display: inline-block; min-width: 1.6em; text-align: center; padding: .12em .5em; margin: 0 .12em; border: 2px solid #3c2417; border-bottom-width: 4px; border-radius: .45em; background: #fbf3e1; font: 700 calc(var(--u) * 1.25) Georgia, serif; color: #2a1d14; }
  #panel input[type=range] { width: 52%; accent-color: #1b3fe0; }
  #panel button.pb { font: calc(var(--u) * 1.5) Georgia, serif; color: #fff6e0; background: #1b3fe0; border: 2px solid #0b1a7a; border-radius: 12px; padding: .35em 1.1em; cursor: pointer; box-shadow: 0 4px 0 #0b1a7a; }
  #panel button.pb:hover { transform: translateY(2px); box-shadow: 0 2px 0 #0b1a7a; }
  #panel button.pb.ghost { color: #15217a; background: transparent; box-shadow: none; border-color: rgba(21,33,122,.55); }
  #panel .foot { margin-top: calc(var(--u) * 1.3); text-align: center; }
  #panel .lv { display: grid; grid-template-columns: repeat(2, 1fr); gap: calc(var(--u) * .9); }
  #panel .lv button { text-align: left; padding: calc(var(--u) * .8) calc(var(--u) * 1); font: italic calc(var(--u) * 1.5) Georgia, serif; color: #2a1d14; background: rgba(255,250,235,.6); border: 2px solid #3c2417; border-radius: 12px; cursor: pointer; transition: background .15s, box-shadow .15s; }
  #panel .lv button b { display: block; font: 700 calc(var(--u) * 2.4)/1 'Playfair Display', Georgia, serif; color: #1b3fe0; }
  #panel .lv button:hover { background: rgba(110,160,255,.25); box-shadow: 0 0 14px rgba(110,160,255,.6); }
  #panel p.note { font-size: calc(var(--u) * 1.15); font-style: italic; color: #6b4a3a; text-align: center; margin: calc(var(--u) * .8) 0 0; }
  #toast { position: absolute; left: 50.6%; width: 34.2%; top: 44%; text-align: center; font: italic calc(var(--u) * 1.9) Georgia, serif; color: #15217a; background: rgba(247,236,211,.92); border: 2px solid #3c2417; border-radius: 12px; padding: .6em 1em; box-sizing: border-box; opacity: 0; pointer-events: none; transition: opacity .3s; }
  #toast.show { opacity: 1; }
  #skipIntro, #unmute { position: absolute; bottom: 18px; color: #f4e6cf; background: rgba(0,0,0,.45); border: 1px solid rgba(244,230,207,.4); border-radius: 10px; padding: .45em 1em; font: 1rem Georgia, serif; cursor: pointer; }
  #skipIntro { right: 18px; } #unmute { left: 18px; display: none; }
  #fatal {
    display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
    background: rgba(23,18,14,.92); color: #f4e6cf; font: 20px/1.5 Georgia, serif; text-align: center; padding: 32px;
  }
  #fatal code { background: rgba(255,255,255,.1); padding: 2px 8px; border-radius: 4px; }
  /* schermata d'avvio (compare solo se il browser blocca l'audio automatico): foglio di quaderno + inchiostro blu */
  #gate { position: absolute; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 0; text-align: center; cursor: pointer;
    background: radial-gradient(ellipse at 50% 45%, #fbf0dc 0%, #f3e2c4 55%, #dcc59b 100%); color: #1b2f8e; transition: opacity .7s ease; user-select: none; }
  #gate.hide { opacity: 0; pointer-events: none; }
  #gate::before { content: ''; position: absolute; inset: 14px; border: 2px solid rgba(60,36,23,.35); border-radius: 22px; pointer-events: none; }
  #gate .drop { width: 62px; height: 78px; margin-bottom: 18px; animation: gdrop 3.2s ease-in-out infinite; filter: drop-shadow(0 6px 6px rgba(27,47,142,.25)); }
  #gate h1 { margin: 0; font: italic 700 clamp(40px, 8vw, 104px)/1 Georgia, serif; letter-spacing: .04em; color: #1b2f8e; text-shadow: 1px 2px 0 rgba(60,36,23,.18); }
  #gate .sub { margin: 10px 0 0; font: italic clamp(14px, 1.8vw, 22px) Georgia, serif; color: #6b4a3a; letter-spacing: .12em; }
  #gate .brush { width: min(520px, 60vw); height: 26px; margin: 14px 0 34px; }
  #gate .go { font: clamp(20px, 2.4vw, 30px) Georgia, serif; color: #fff6e0; background: #1b3fe0; border: 3px solid #0b1a7a; border-radius: 16px; padding: .55em 1.7em;
    box-shadow: 0 8px 0 #0b1a7a, 0 14px 24px rgba(11,26,122,.35); transition: transform .15s, box-shadow .15s; cursor: pointer; }
  #gate:hover .go, #gate .go:focus-visible { transform: translateY(3px); box-shadow: 0 5px 0 #0b1a7a, 0 10px 18px rgba(11,26,122,.35); outline: none; }
  #gate .hint { margin-top: 22px; font: italic clamp(13px, 1.5vw, 18px) Georgia, serif; color: #8a6a55; animation: gfade 2.4s ease-in-out infinite; }
  @keyframes gdrop { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.04, .97); } }
  @keyframes gfade { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  #unmute.startbtn { left: 50%; top: 50%; right: auto; bottom: auto; transform: translate(-50%, -50%); font-size: 30px; padding: 22px 40px; }
</style>

<body>

<div id="introWrap">

<script>
/* ===== COMANDI TOUCH (telefono / tablet): pulsanti a schermo che mandano gli stessi tasti della tastiera; nel boss, tastiera a schermo.
   Compaiono solo su dispositivi touch (o con ?touch=1 nell'indirizzo) e solo dentro i livelli. ===== */
try { if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (_) {}      // permette "Installa app" (schermo intero vero)
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}      // iPhone: l'audio del gioco suona anche con la levetta del silenzioso
window.TouchUI = (() => {
  const q = new URLSearchParams(location.search);
  const coarse = matchMedia('(hover: none) and (pointer: coarse)').matches || q.get('touch') === '1';
  if (!coarse) return { set() {}, touch: false };
  const css = document.createElement('style');
  css.textContent = `
    #touch, #touch * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; box-sizing: border-box; }
    #touch { position: fixed; inset: 0; z-index: 30; pointer-events: none; font-family: Georgia, serif; --b: clamp(40px, 12vmin, 78px); --j: clamp(104px, 34vmin, 170px); }
    #touch .g { display: none; position: absolute; gap: calc(var(--b) * .22); pointer-events: none; }
    #touch[data-k=play] .p, #touch[data-k=ascent] .p, #touch[data-k=play] .pl, #touch[data-k=boss] .bo { display: flex; }
    #touch .tb { pointer-events: auto; width: var(--b); height: var(--b); border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: calc(var(--b) * .46); color: #2a1d14; background: rgba(246,233,207,.55); border: 3px solid rgba(42,29,20,.75); box-shadow: 0 2px 8px rgba(0,0,0,.35); }
    #touch .tb.on { background: rgba(246,233,207,.95); transform: scale(.94); }
    #touch[data-k=play] .js, #touch[data-k=ascent] .js { display: block; }
    #touch .js { left: max(3vmin, env(safe-area-inset-left, 0px)); bottom: max(3vmin, env(safe-area-inset-bottom, 0px)); width: var(--j); height: var(--j); pointer-events: none; }
    #touch .jb { pointer-events: auto; position: relative; width: 100%; height: 100%; border-radius: 50%; background: rgba(246,233,207,.28); border: 3px solid rgba(42,29,20,.7); box-shadow: 0 2px 10px rgba(0,0,0,.35) inset, 0 2px 8px rgba(0,0,0,.3); }
    #touch .jb::before { content: ''; position: absolute; inset: 14%; border-radius: 50%; border: 2px dashed rgba(246,233,207,.35); }
    #touch .jk { position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; margin: -21% 0 0 -21%; border-radius: 50%; background: rgba(246,233,207,.9); border: 3px solid rgba(42,29,20,.85); box-shadow: 0 3px 8px rgba(0,0,0,.45); }
    #touch .cr { right: max(3.5vmin, env(safe-area-inset-right, 0px)); bottom: max(4vmin, env(safe-area-inset-bottom, 0px)); flex-direction: row; align-items: flex-end; }
    #touch .cx { right: max(3vmin, env(safe-area-inset-right, 0px)); top: max(3vmin, env(safe-area-inset-top, 0px)); }
    #touch .cx .tb { width: calc(var(--b) * .6); height: calc(var(--b) * .6); font-size: calc(var(--b) * .3); }
    #touch .kb { left: 0; right: 0; bottom: 0; flex-direction: column; align-items: center; justify-content: center; gap: 1.1vh; padding: 1vh 1.5vw; background: rgba(23,18,14,.94); }
    #touch .kr { display: flex; gap: .9vw; width: 100%; justify-content: center; }
    #touch .kk { pointer-events: auto; flex: 0 0 auto; width: 8.2vw; height: calc(var(--kh) * .2); border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font: 600 calc(var(--kh) * .12)/1 Georgia, serif; color: #f6e9cf; background: rgba(246,233,207,.16); border: 2px solid rgba(246,233,207,.35); }
    #touch .kk.on { background: rgba(246,233,207,.75); color: #2a1d14; }
    #touch .kk.w { width: 12vw; } #touch .kk.sp { width: 44vw; } #touch .kk.go { width: 20vw; background: rgba(214,40,40,.55); border-color: rgba(255,200,200,.7); }
    #rot { display: none; position: fixed; inset: 0; z-index: 60; background: #17120e; color: #f6e9cf; align-items: center; justify-content: center; text-align: center; font: italic 28px/1.5 Georgia, serif; padding: 24px; }
    @media (orientation: portrait) { #rot { display: flex; } }`;
  document.head.appendChild(css);
  const rot = document.createElement('div'); rot.id = 'rot'; rot.innerHTML = '<div>Gira il telefono in orizzontale<br><span style="font-size:20px;opacity:.7">il gioco si vede e si gioca meglio</span></div>'; document.body.appendChild(rot);
  const root = document.createElement('div'); root.id = 'touch'; document.body.appendChild(root);
  const KC = { ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, ' ': 32, e: 69, r: 82, Enter: 13, Backspace: 8 };
  const fire = (type, key) => {                                       // tasto "finto": il gioco lo legge come uno vero della tastiera
    const kc = KC[key] != null ? KC[key] : (key.length === 1 ? key.toUpperCase().charCodeAt(0) : 0);
    const ev = new KeyboardEvent(type, { key, bubbles: true, cancelable: true });
    Object.defineProperty(ev, 'keyCode', { get: () => kc }); Object.defineProperty(ev, 'which', { get: () => kc });
    window.dispatchEvent(ev);
  };
  const hold = (el, keys) => {                                       // pulsante tenuto premuto = tasto tenuto premuto
    let down = false;
    const on = (e) => { e.preventDefault(); if (down) return; down = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (_) {} keys.forEach(k => fire('keydown', k)); };
    const off = (e) => { if (!down) return; down = false; el.classList.remove('on'); keys.forEach(k => fire('keyup', k)); };
    el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
  };
  const tap = (el, key) => {                                         // pulsante a tocco singolo (tastiera, riavvia)
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.classList.add('on'); fire('keydown', key); setTimeout(() => fire('keyup', key), 60); });
    const off = () => el.classList.remove('on'); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
  };
  const mk = (cls, parent) => { const d = document.createElement('div'); d.className = 'g ' + cls; (parent || root).appendChild(d); return d; };
  const btn = (parent, txt, cls) => { const b = document.createElement('div'); b.className = cls || 'tb'; b.textContent = txt; parent.appendChild(b); return b; };
  const js = mk('js p'), cr = mk('cr pl'), cx = mk('cx pl');
  /* LEVA: si sposta con il pollice in qualsiasi direzione; in diagonale (su + destra) tiene premuti i due tasti insieme = salto in avanti */
  const jb = document.createElement('div'); jb.className = 'jb'; const jk = document.createElement('div'); jk.className = 'jk'; jb.appendChild(jk); js.appendChild(jb);
  const stt = { L: false, R: false, U: false, D: false };
  const setK = (n, on, keys) => { if (stt[n] === on) return; stt[n] = on; keys.forEach(k => fire(on ? 'keydown' : 'keyup', k)); };
  const apply = (dx, dy) => { setK('L', dx < -0.3, ['ArrowLeft']); setK('R', dx > 0.3, ['ArrowRight']); setK('U', dy < -0.4, ['ArrowUp', ' ']); setK('D', dy > 0.5, ['ArrowDown']); };
  let jpid = null;
  const jmove = (e) => {
    const r = jb.getBoundingClientRect(), R = r.width / 2; let dx = (e.clientX - (r.x + R)) / R, dy = (e.clientY - (r.y + R)) / R; const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    jk.style.transform = 'translate(' + (dx * R * 0.55).toFixed(1) + 'px,' + (dy * R * 0.55).toFixed(1) + 'px)'; apply(dx, dy);
  };
  const jend = (e) => { if (jpid === null || (e.pointerId !== undefined && e.pointerId !== jpid)) return; jpid = null; jk.style.transform = ''; apply(0, 0); };
  jb.addEventListener('pointerdown', (e) => { e.preventDefault(); if (jpid !== null) return; jpid = e.pointerId; try { jb.setPointerCapture(jpid); } catch (_) {} jmove(e); });
  jb.addEventListener('pointermove', (e) => { if (e.pointerId === jpid) { e.preventDefault(); jmove(e); } });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => jb.addEventListener(n, jend));
  const lever = btn(cr, 'E'); tap(lever, 'e');                         // E dall'altra parte (solo nei livelli di piattaforma)
  tap(btn(cx, '↻'), 'r');
  const kb = mk('kb bo');
  ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'].forEach((row, i) => {
    const r = document.createElement('div'); r.className = 'kr'; kb.appendChild(r);
    [...row].forEach(ch => tap(btn(r, ch, 'kk'), ch));
    if (i === 2) tap(btn(r, '⌫', 'kk w'), 'Backspace');
  });
  const last = document.createElement('div'); last.className = 'kr'; kb.appendChild(last);
  tap(btn(last, 'spazio', 'kk sp'), ' '); tap(btn(last, 'SPARA', 'kk go'), 'Enter');
  let kind = null;
  const layout = () => {
    const cv = document.querySelector('#game canvas'); if (!cv) return;
    const kh = Math.round(innerHeight * 0.4); kb.style.setProperty('--kh', kh + 'px'); kb.style.height = kh + 'px';
    if (kind === 'boss') { cv.style.transformOrigin = '50% 0'; cv.style.transform = 'scale(' + ((innerHeight - kh) / innerHeight).toFixed(3) + ')'; }   // il gioco si rimpicciolisce e lascia posto alla tastiera
    else cv.style.transform = '';
  };
  addEventListener('resize', layout); addEventListener('orientationchange', () => setTimeout(layout, 300));
  return { touch: true, set(k) { kind = k; jpid = null; jk.style.transform = ''; apply(0, 0); root.dataset.k = k || ''; layout(); } };
})();

/* ======================================================================
   LOGICA PURA (nessuna dipendenza da Phaser) – coordinate in pixel dello
   sfondo originale 2752 x 1536.
   ====================================================================== */
// === LOGIC START ===

function makePolySurface(pts, opts = {}) {
  return {
    solid: opts.solid !== false, strict: !!opts.strict,
    yAt(x) {
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        if (x >= a[0] && x <= b[0]) {
          const t = (x - a[0]) / ((b[0] - a[0]) || 1);
          return a[1] + (b[1] - a[1]) * t;
        }
      }
      return null;
    }
  };
}
function makePlatform(x0, x1, y) {
  return { solid: false, yAt: (x) => (x >= x0 && x <= x1 ? y : null) };
}
function baseSurfaces(cfg) {
  const dy = cfg.surfDy || 0;   // correzione verticale del suolo calpestabile rispetto al disegno
  return [...cfg.terrain.map(p => makePolySurface(p.map(([x, y]) => [x, y + dy]))), ...(cfg.ramps || []).map(p => makePolySurface(p, { solid: false, strict: true })),
          ...cfg.steps.map(s => makePlatform(s.x0, s.x1, s.y + dy))];
}

function findSupport(surfaces, s) {
  let best = null;
  for (const sf of surfaces) {
    const y = sf.yAt(s.x);
    if (y === null) continue;
    let ok;
    const tu = sf.strict ? 18 : C.stepUp, td = sf.strict ? 18 : C.snapDown;   // le rampe "strette" (scale) si salgono solo stando già su
    if (s.onGround && s.vy >= 0) ok = (y >= s.bottom - tu && y <= s.bottom + td);
    else ok = s.vy >= 0 && s.prevBottom <= y + C.landTol && s.bottom >= y;
    if (ok && (best === null || y < best)) best = y;
  }
  return best;
}

function resolve(s, surfaces, walls) {
  const wasGround = s.onGround;
  if (walls) {                                         // muri verticali: bloccano la corsa da entrambi i lati
    const top = s.bottom - C.bodyH, hw = C.bodyW / 2;
    for (const w of walls) {
      if (s.bottom > w.y0 && top < w.y1) {
        if (s.prevX + hw <= w.x && s.x + hw > w.x) { s.x = w.x - hw; if (s.vx > 0) s.vx = 0; }
        else if (s.prevX - hw >= w.x && s.x - hw < w.x) { s.x = w.x + hw; if (s.vx < 0) s.vx = 0; }
      }
    }
  }
  if (s.x < C.minX) { s.x = C.minX; if (s.vx < 0) s.vx = 0; }
  if (s.x > C.maxX) { s.x = C.maxX; if (s.vx > 0) s.vx = 0; }
  if (wasGround && s.x !== s.prevX) {
    for (const sf of surfaces) {
      if (!sf.solid) continue;
      const y = sf.yAt(s.x);
      if (y !== null && y < s.bottom - C.stepUp && y > s.bottom - C.bodyH) { s.x = s.prevX; s.vx = 0; break; }
    }
  }
  const y = findSupport(surfaces, s);
  if (y !== null) { s.bottom = y; s.vy = 0; s.onGround = true; }
  else s.onGround = false;
  s.prevBottom = s.bottom;
  s.prevX = s.x;
}

const approach = (v, target, delta) => (v < target ? Math.min(v + delta, target) : Math.max(v - delta, target));

function control(s, inp, dt) {
  s.justJumped = false;
  s.coyote = s.onGround ? C.coyote : Math.max(0, s.coyote - dt);
  s.jumpBuf = inp.jumpPressed ? C.buffer : Math.max(0, s.jumpBuf - dt);
  const target = inp.dir * C.runSpeed;
  if (inp.dir === 0) s.vx = approach(s.vx, 0, (s.onGround ? C.decGround : C.accAir * 0.5) * dt);
  else s.vx = approach(s.vx, target, (s.onGround ? C.accGround : C.accAir) * dt);
  if (s.jumpBuf > 0 && (s.onGround || s.coyote > 0)) {
    s.vy = -C.jumpV; s.onGround = false; s.coyote = 0; s.jumpBuf = 0; s.justJumped = true;
  }
  if (!inp.jumpHeld && s.vy < -C.jumpCut && !s.onGround) s.vy = -C.jumpCut;
}

function chaikin(pts, iters) {
  for (let k = 0; k < iters; k++) {
    const out = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const p = pts[i], q = pts[i + 1];
      out.push([0.75 * p[0] + 0.25 * q[0], 0.75 * p[1] + 0.25 * q[1]],
               [0.25 * p[0] + 0.75 * q[0], 0.25 * p[1] + 0.75 * q[1]]);
    }
    out.push(pts[pts.length - 1]);
    pts = out;
  }
  return pts;
}

// pts: polilinea da sinistra a destra, dalla punta sinistra (AL) alla punta destra (AR)
function computeBridge(pts, AL, AR) {
  // il ponte copre tutto l'inchiostro tracciato (anche oltre le punte) e ha due rampette alle estremità
  let sx0 = Infinity, sx1 = -Infinity;
  for (const p of pts) { sx0 = Math.min(sx0, p[0]); sx1 = Math.max(sx1, p[0]); }
  const x0 = Math.floor(Math.min(AL.x, sx0)), x1 = Math.ceil(Math.max(AR.x, sx1)), n = x1 - x0 + 1;
  const EXT = 48;
  const ys = new Float32Array(n).fill(Infinity);
  for (let i = 0; i < pts.length - 1; i++) {
    let [xa, ya] = pts[i], [xb, yb] = pts[i + 1];
    if (xa > xb) { [xa, xb] = [xb, xa]; [ya, yb] = [yb, ya]; }
    for (let x = Math.max(x0, Math.ceil(xa)); x <= Math.min(x1, Math.floor(xb)); x++) {
      const t = xb === xa ? 0 : (x - xa) / (xb - xa);
      const y = ya + (yb - ya) * t;
      if (y < ys[x - x0]) ys[x - x0] = y;
    }
  }
  for (let i = 0; i < n; i++) {
    if (ys[i] !== Infinity) continue;
    let l = i - 1, r = i + 1;
    while (l >= 0 && ys[l] === Infinity) l--;
    while (r < n && ys[r] === Infinity) r++;
    ys[i] = l >= 0 && r < n ? ys[l] + (ys[r] - ys[l]) * ((i - l) / (r - l)) : (l >= 0 ? ys[l] : (r < n ? ys[r] : AL.y));
  }
  return {
    ys, x0, x1,
    surface: {
      solid: true,
      yAt(x) {
        if (x < x0 - EXT || x > x1 + EXT) return null;
        if (x < x0) { const yi = ys[0] - C.inkHalf; return yi + (AL.y - yi) * ((x0 - x) / EXT); }   // rampa d'ingresso dalla roccia
        if (x > x1) { const yi = ys[n - 1] - C.inkHalf; return yi + (AR.y - yi) * ((x - x1) / EXT); } // rampa d'uscita verso la roccia
        const f = x - x0, i = Math.floor(f), t = f - i;
        const a = ys[i], b = ys[Math.min(i + 1, n - 1)];
        return a + (b - a) * t - C.inkHalf;
      }
    }
  };
}

// Sutherland–Hodgman: tiene la parte del poligono con y >= yLevel (inchiostro che riempie un'ampolla dal basso)
function clipBelow(poly, yLevel) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], ain = a[1] >= yLevel, bin = b[1] >= yLevel;
    if (ain) out.push(a);
    if (ain !== bin) { const t = (yLevel - a[1]) / (b[1] - a[1]); out.push([a[0] + (b[0] - a[0]) * t, yLevel]); }
  }
  return out;
}

  Z.ropes = Pz.ropes.map(rp => rp.fixed

function pzMove(Z, Pz, s, dt) {

function pzDropsStep(drops, Pz, surfaces, td, dt, groundY) {
  const ev = [];
  for (const d of drops) {
    const lt = (td + d.cfg.ph) % Pz.period;
    if (lt < d.lt) { d.st = 'grow'; d.y = d.y0; d.vy = 0; d.sp = 0; }   // nuovo ciclo
    d.lt = lt;
    if (d.st === 'grow' && lt >= Pz.grow) { d.st = 'fall'; d.vy = 0; d.y = d.y0 + d.r * 0.9; }

function drawInk(g, pts) {
  const samples = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const n = Math.max(1, Math.ceil(dist(a[0], a[1], b[0], b[1]) / 2.5));
    for (let k = 0; k < n; k++) { const t = k / n; samples.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
  }
  samples.push(pts[pts.length - 1]);
  const R = C.inkHalf;
  g.fillStyle(INK.edge, 0.85);                                                  // bordo: acqua più densa ai lati
  samples.forEach((p, i) => g.fillCircle(p[0], p[1], R + 2 + Math.sin(i * 0.31) * 0.9));
  g.fillStyle(INK.core, 0.92);                                                  // corpo
  samples.forEach((p, i) => g.fillCircle(p[0], p[1], R - 0.5 + Math.sin(i * 0.23 + 1) * 0.8));
  g.fillStyle(INK.shine, 0.35);                                                 // lucido sulla parte alta
  samples.forEach((p, i) => g.fillCircle(p[0], p[1] - R * 0.38, R * 0.45 + Math.sin(i * 0.17) * 0.6));
  g.fillStyle(0xffffff, 0.7);                                                   // riflessi puntiformi + bollicine
  samples.forEach((p, i) => { if (i % 23 === 0) g.fillCircle(p[0] - 1, p[1] - R * 0.45, 2.2); });
  g.fillStyle(INK.shine, 0.55);
  samples.forEach((p, i) => { if (i % 41 === 7) g.fillCircle(p[0] + 3, p[1] + 1, 2.6); });
}

    const fw = (w - 6) * ratio;
    if (fw > 2) {
      const r = Math.min(6, fw / 2);
      g.fillStyle(0x0a2fd2, 1); g.fillRoundedRect(x + 3, y + 3, fw, h - 6, r);
      g.fillStyle(0x5a82ff, 0.85); g.fillRoundedRect(x + 3, y + 5, fw, 6, Math.min(3, fw / 2));
    }
    this.inkText.setText(Math.round(this.inkShown) + ' / ' + C.inkMax);
  }

  /* ---------- Porta d'uscita: due ante ritagliate dallo sfondo che si aprono ---------- */
  buildDoor() {
    const P = this.cfg.door.panel, w = P.x1 - P.x0, h = P.y1 - P.y0, hw = Math.round(w / 2);
    const src = this.textures.get(this.cfg.key).getSourceImage();
    const kL = 'doorL' + this.cfg.id, kR = 'doorR' + this.cfg.id;
    if (!this.textures.exists(kL)) {
      const full = document.createElement('canvas'); full.width = w; full.height = h;
      const fx = full.getContext('2d'), r = w / 2;
      fx.beginPath(); fx.moveTo(0, h); fx.lineTo(0, r); fx.arc(r, r, r, Math.PI, 0); fx.lineTo(w, h); fx.closePath(); fx.clip();
      fx.drawImage(src, P.x0, P.y0, w, h, 0, 0, w, h);
      const L = this.textures.createCanvas(kL, hw, h); L.getContext().drawImage(full, 0, 0, hw, h, 0, 0, hw, h); L.refresh();
      const R = this.textures.createCanvas(kR, w - hw, h); R.getContext().drawImage(full, hw, 0, w - hw, h, 0, 0, w - hw, h); R.refresh();
    }
    // interno luminoso (visibile solo quando le ante si aprono)
    const r = w / 2, cx = P.x0 + r;
    const g = this.add.graphics().setDepth(2).setVisible(false);
    g.fillStyle(0xffd98a, 1); g.fillCircle(cx, P.y0 + r, r); g.fillRect(P.x0, P.y0 + r, w, h - r);
    g.fillStyle(0xffeec2, 1); g.fillCircle(cx, P.y0 + r + 10, r * 0.78); g.fillRect(P.x0 + r * 0.22, P.y0 + r + 10, w - r * 0.44, h - r - 10);
    g.fillStyle(0xfffaf0, 0.9); g.fillCircle(cx, P.y0 + r + 30, r * 0.45); g.fillRect(P.x0 + r * 0.55, P.y0 + r + 30, w - r * 1.1, h - r - 30);
    this.doorGlow = g;
    this.doorL = this.add.image(P.x0, P.y0, kL).setOrigin(0, 0).setDepth(3);
    this.doorR = this.add.image(P.x1, P.y0, kR).setOrigin(1, 0).setDepth(3);
  }

  openDoor() {
    if (this.doorOpened) return;
    this.doorOpened = true;
    Snd.door();
    this.doorGlow.setVisible(true);
    this.tweens.add({ targets: [this.doorL, this.doorR], scaleX: 0.1, duration: 1100, ease: 'Cubic.out' });
    const P = this.cfg.door.panel;
    const halo = this.add.circle((P.x0 + P.x1) / 2, (P.y0 + P.y1) / 2, 160, 0xffe9a8, 0.35).setDepth(2);
    this.tweens.add({ targets: halo, alpha: 0, scale: 1.9, duration: 1400, repeat: -1 });
  }

  /* ---------- Leva + pietre d'inchiostro (stanza 2) ---------- */
  buildLever() {
    const L = this.cfg.lever;
    this.lever = { done: false };
    this.stoneG = this.add.graphics().setDepth(6);
    this.leverPrompt = this.add.text(L.x, L.y - 230, 'Premi E', { fontFamily: 'Georgia, serif', fontStyle: 'italic', fontSize: '38px', color: '#1b2fae',
      backgroundColor: 'rgba(250,238,215,0.9)', padding: { x: 14, y: 6 } }).setOrigin(0.5).setDepth(40).setVisible(false);
    this.tweens.add({ targets: this.leverPrompt, y: L.y - 245, yoyo: true, repeat: -1, duration: 700 });
  }

  pullLever() {
    if (this.sn) { this.interactSn(); return; }
    if (this.pz) { this.pullLeverPz(); return; }
    if (this.cfg.levers) { this.pullLevers(); return; }
    const L = this.cfg.lever, s = this.ps;
    if (!L || this.lever.done || this.finished || this.dead) return;
    if (!(Math.abs(s.x - L.x) < L.r && Math.abs(s.bottom - L.y) < 30)) return;
    this.lever.done = true; this.leverPrompt.setVisible(false);
    this.cameras.main.flash(200, 120, 150, 255);
    this.toast(L.msg || 'La pietra si accende: l’inchiostro sboccia verso il pianale', W / 2, 330);
    this.growStones();
  }

  // i gradini di pietra compaiono uno alla volta e diventano calpestabili
  growStones() {
    const SP = this.cfg.sprites && this.cfg.sprites.gradino;
    this.cfg.stones.forEach((st, i) => this.time.delayedCall(500 + i * 350, () => {
      const cx = (st.x0 + st.x1) / 2;
      if (st.spr && SP) {                                     // gradino di pietra copiato dalla torre: spunta con un piccolo rimbalzo
        const im = this.add.image(cx, st.y, SP.key).setOrigin(SP.ox, SP.oy).setDepth(6).setFlipX(!!st.flip).setAlpha(0).setScale(0.3);
        this.tweens.add({ targets: im, alpha: 1, scale: 1, duration: 450, ease: 'Back.easeOut' });
      } else if (!st.noDraw) {                                // altre stanze: pietra disegnata con l’inchiostro
        const g = this.add.graphics().setDepth(6);
        drawInk(g, [[st.x0, st.y + C.inkHalf], [st.x1, st.y + C.inkHalf + 2]]);
        this.tweens.add({ targets: g, alpha: { from: 0, to: 1 }, duration: 450 });
      }
      if (st.spr || st.noDraw) {                              // piccolo bagliore: da ora il gradino è solido
        const gl = this.add.circle(cx, st.y, 30, 0x6f8cff, 0.5).setDepth(7);
        this.tweens.add({ targets: gl, scale: 2.2, alpha: 0, duration: 500, onComplete: () => gl.destroy() });
      }
      this.surfaces.push(makePlatform(st.x0, st.x1, st.y));   // da ora è calpestabile
    }));
  }

  /* ---------- Stanza 7: la mongolfiera trattenuta da corde e ancore ---------- */
  buildGlobo() {
    const G = this.cfg.globo, sp = this.cfg.sprites, gl = this.gl = { dy: 0, released: false, done: false };
    const dim = (k) => this.textures.get(k).getSourceImage();
    gl.ropes = this.add.image(G.corde.x, G.corde.y, sp.corde.key).setOrigin(0, 0).setDepth(3.1);
    const mk = (cfg, k) => { const t = dim(k); return this.add.image(cfg.x + t.width / 2, cfg.y + t.height / 2, k).setDepth(3.2); };
    gl.ancD = mk(G.ancD, sp.ancD.key); gl.ancS = mk(G.ancS, sp.ancS.key);
    gl.img = this.add.image(G.globo.x, G.globo.y, sp.globo.key).setOrigin(0, 0).setDepth(3.3);
    // il bordo del cesto è calpestabile (ci si atterra da sopra) e segue la mongolfiera quando sale
    this.surfaces.push({ solid: false, yAt: (x) => (x >= G.rim.x0 && x <= G.rim.x1 ? G.rim.y + gl.dy : null) });
  }

  releaseGlobo() {
    const G = this.cfg.globo, gl = this.gl;
    if (!gl || gl.released) return;
    gl.released = true;
    // il ponte d'inchiostro si scioglie (la mongolfiera ci passerebbe attraverso)
    if (this.bridge) {
      const i = this.surfaces.indexOf(this.bridge.surface); if (i >= 0) this.surfaces.splice(i, 1);
      this.tweens.add({ targets: this.bridgeG, alpha: 0, duration: 700 });
    }
    // i tiranti si sciolgono
    this.tweens.add({ targets: gl.ropes, alpha: 0, y: gl.ropes.y + 90, duration: 900, ease: 'Quad.in' });
    // le due ancore cadono nel vuoto
    this.tweens.add({ targets: gl.ancD, y: gl.ancD.y + 1300, angle: 55, duration: 1300, ease: 'Quad.in', onComplete: () => gl.ancD.destroy() });
    this.tweens.add({ targets: gl.ancS, y: gl.ancS.y + 700, angle: -35, duration: 1000, delay: 150, ease: 'Quad.in', onComplete: () => gl.ancS.destroy() });
    this.time.delayedCall(900, () => Snd.splash());
    // la mongolfiera si libera e sale piano, poi sempre più veloce
    this.time.delayedCall(G.delay, () => {
      Snd.pickup();
      this.tweens.add({
        targets: gl, dy: -G.rise, duration: G.dur, ease: 'Cubic.inOut',
        onUpdate: () => { gl.img.y = G.globo.y + gl.dy; },
        onComplete: () => {
          gl.done = true;
          const s = this.ps;
          const on = s.onGround && s.x >= G.rim.x0 && s.x <= G.rim.x1 && Math.abs(s.bottom - (G.rim.y + gl.dy)) < 8;
          if (!on && !this.finished && !this.dead) this.toast('Troppo tardi! Premi R per riprovare', W / 2, 330);
          else if (on && !this.finished && !this.dead) { this.finished = true; this.time.delayedCall(500, () => this.restart(this.cfg.next, this.lives)); }   // si sale: stanza 8
        }
      });
    });
  }

  /* ---------- Stanza 9: il boss finale, Mostro dei Vuoti (typing shooter) ---------- */
  createBoss() {
    const K = 2752 / 1377;                                            // coordinate in px dell'immagine 1377x768 -> px di gioco
    this.bs = { K, FL: 610 * K, HX: 440 * K, t: 0, ph: 'intro', wave: 0, hp: 100, tint: 0, mins: [], shots: [], parts: [], target: null, spawned: 0, count: 0, next: 0, hits: 0, rt: 0, winT: 0, throwT: 0,
      hx: 700 * K * 0 + 700, hxT: 440 * K, face: 1, run: 0, dt: 0, rings: [], bolts: [], pud: [], vort: [],
      bx: 890 * K, by: 250 * K, tx: 890 * K, ty: 250 * K, ext: 0, look: 0, fade: 1, flash: 0 };
    const B = this.bs;
    this.add.image(0, 0, 'bg9').setOrigin(0, 0).setDisplaySize(W, H).setDepth(0);
    this.bossC = this.add.container(B.bx, B.by).setDepth(5);

    this.buildEnemies();                                              // registra i fotogrammi di goccia e corvo
    const tex = this.textures.get('player');
    if (!tex.has('idle0')) for (const [set, list] of Object.entries(SHEET)) list.forEach(([x, y, w, h, ax, ay], i) => { const f = tex.add(set + i, 0, x, y, w, h); f.customPivot = true; f.pivotX = (ax - x) / w; f.pivotY = (ay - y) / h; });
    const rb = this.textures.get('runbody');
    if (!rb.has('runb0')) RUNBODY.forEach((d, i) => { const f = rb.add('runb' + i, 0, d[0], d[1], d[2], d[3]); f.customPivot = true; f.pivotX = d[4]; f.pivotY = 1; });
    this.legG = this.add.graphics().setDepth(9.5);

    this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.2).setDepth(1);               // sala un po' più buia: la torcia fa luce

      const ct = this.textures.createCanvas('glow9', 256, 256), c = ct.getContext(), gr = c.createRadialGradient(128, 128, 0, 128, 128, 128);
      gr.addColorStop(0, 'rgba(255,210,120,1)'); gr.addColorStop(0.3, 'rgba(255,160,60,0.5)'); gr.addColorStop(1, 'rgba(255,120,30,0)');
      c.fillStyle = gr; c.fillRect(0, 0, 256, 256); ct.refresh();
    }
    this.torch = this.add.image(0, 0, 'torcia').setOrigin(0.5, 0.94).setDepth(9.9);                        // dietro all'omino: la manina stringe il manico
    this.gl = [0, 1, 2].map(() => this.add.image(0, 0, 'glow9').setBlendMode(Phaser.BlendModes.ADD).setDepth(11));
    this.bEyeG = BOSSEYES.map((e, i) => { const o = this.add.image(0, 0, 'glow9').setBlendMode(Phaser.BlendModes.ADD); this.bossC.addAt(o, 4 + i); return o; });   // occhi luminescenti
    this.add.graphics().setDepth(18).fillStyle(0xf3e3c3, 0.72).fillRoundedRect(36, 40, 520, 140, 18);
    this.buildHudPatch(); this.buildHearts(); this.buildHudIcon();
    this.ink = this.inkShown = C.inkMax; this.drawHud();
    this.bbar = this.add.graphics().setDepth(26);
    this.add.text(W / 2, 12, 'MOSTRO DEI VUOTI', { fontFamily: 'Georgia, serif', fontStyle: 'italic bold', fontSize: '30px', color: '#f3e3c3', stroke: '#1a1411', strokeThickness: 6 }).setOrigin(0.5, 0).setDepth(27);
    this.bmsg = this.add.text(W / 2, 330, '', { fontFamily: 'Georgia, serif', fontStyle: 'italic bold', fontSize: '86px', color: '#15217a', stroke: '#f6e6cc', strokeThickness: 10, align: 'center' }).setOrigin(0.5).setDepth(60).setAlpha(0);
    const kb = this.input.keyboard; kb.addCapture('SPACE');

    if (first) this.bossHelp(); else this.bossMsg('IL MOSTRO DEI VUOTI', 2000);
    this.time.delayedCall(first ? 8400 : 2300, () => this.bossWave());
    if (QS.get('finale') === '1') this.time.delayedCall(800, () => this.bossEnd());
  }

  buildIdleMonster() {                                                 // mostro fermo sullo sfondo (livello 4): sprite sopra l'originale, che respira e muove gli occhi
    const m = this.cfg.idleMonster; this.idleMon = null; if (!m) return;
    const f = this.textures.get(this.cfg.key).getSourceImage().width / 2576;
    const c = this.add.container((m.x + m.ax) * f, (m.y + m.ay) * f).setDepth(1).setScale(f), g = this.add.graphics();
    c.add([this.add.image(-m.ax, -m.ay, m.key).setOrigin(0, 0), g]);
    this.idleMon = { c, g, m, f, t: Math.random() * 6, blink: 0, nextBlink: 1.5 + Math.random() * 2 };
  }

  updateIdleMonster(dt) {
    const o = this.idleMon; if (!o) return;
    o.t += dt; const br = (Math.sin(o.t * 1.5) + 1) / 2;                 // respiro lento: si gonfia e si sgonfia, restando sempre sopra l'originale
    o.c.setScale(o.f * (1 + 0.012 * br), o.f * (1 + 0.045 * br));
    o.nextBlink -= dt; if (o.nextBlink <= 0) { o.blink = 0.14; o.nextBlink = 2.2 + Math.random() * 3.5; }
    let open = 1; if (o.blink > 0) { o.blink -= dt; open = Math.abs(o.blink / 0.14 * 2 - 1); }
    const look = Math.sin(o.t * 0.7) * 2.2, up = Math.sin(o.t * 0.5) * 0.8, g = o.g; g.clear(); g.fillStyle(0xf4f1e8, 1);
    o.m.eyes.forEach(e => g.fillEllipse(e.cx - o.m.ax + look, e.cy - o.m.ay + up, e.rx * 2, Math.max(1.2, e.ry * 2 * open)));
  }

  introPanel(o) {                                                      // finestra con le istruzioni a inizio livello. Grande = il gioco aspetta; "small" = piccola, il gioco parte subito
    const small = !!o.small, lines = (small && window.TouchUI && TouchUI.touch && o.touchLines) ? o.touchLines : o.lines;
    if (!small) this.helpOpen = true;
    const fs = small ? 38 : 50, ts = small ? 50 : 70, step = small ? 78 : 125, pw = small ? 1500 : 1920;
    const hgt = (small ? 130 : 150) + lines.length * step + (small ? 70 : 110), cy = small ? 330 : H / 2;
    const c = this.add.container(W / 2, cy).setDepth(70).setAlpha(0), bg = this.add.graphics();
    bg.fillStyle(0xf6e9cf, small ? 0.93 : 0.97); bg.fillRoundedRect(-pw / 2, -hgt / 2, pw, hgt, 26); bg.lineStyle(5, 0x2a1d14, 1); bg.strokeRoundedRect(-pw / 2, -hgt / 2, pw, hgt, 26);
    const tx = (y, str, sz, col, st) => this.add.text(0, y, str, { fontFamily: 'Georgia, serif', fontStyle: st || 'normal', fontSize: sz + 'px', color: col, align: 'center', wordWrap: { width: pw - 100 } }).setOrigin(0.5);
    c.add([bg, tx(-hgt / 2 + (small ? 60 : 90), o.title, ts, '#15217a', 'italic bold'), ...lines.map((l, i) => tx(-hgt / 2 + (small ? 150 : 220) + i * step, l, fs, '#2a1d14')),
      tx(hgt / 2 - (small ? 38 : 60), small ? 'tocca un tasto o clicca per iniziare' : 'Premi un tasto o clicca per iniziare', small ? 28 : 38, '#6b5a47', 'italic')]);
    this.tweens.add({ targets: c, alpha: 1, duration: 350 });
    let done = false;
    const close = () => {
      if (done) return; done = true; this.helpOpen = false;
      this.input.keyboard.off('keydown', close); this.input.off('pointerdown', close);
      this.tweens.add({ targets: c, alpha: 0, duration: 300, onComplete: () => c.destroy() });
    };
    this.time.delayedCall(small ? 300 : 600, () => { this.input.keyboard.on('keydown', close); this.input.on('pointerdown', close); });   // niente chiusure accidentali subito
    if (small) this.time.delayedCall(9000, close);                      // la piccola sparisce da sola dopo 9 secondi
  }

  bossHelp() {                                                         // istruzioni a inizio livello
    const c = this.add.container(W / 2, 430).setDepth(70).setAlpha(0), bg = this.add.graphics();
    bg.fillStyle(0xf6e9cf, 0.96); bg.fillRoundedRect(-960, -290, 1920, 580, 30); bg.lineStyle(6, 0x2a1d14, 1); bg.strokeRoundedRect(-960, -290, 1920, 580, 30);
    const tx = (y, str, sz, col, bold) => this.add.text(0, y, str, { fontFamily: 'Georgia, serif', fontStyle: bold ? 'italic bold' : 'normal', fontSize: sz + 'px', color: col, align: 'center', wordWrap: { width: 1800 } }).setOrigin(0.5);
    c.add([bg, tx(-225, 'IL MOSTRO DEI VUOTI', 72, '#15217a', true),
      tx(-105, '1.  SCRIVI con la ' + (window.TouchUI && TouchUI.touch ? 'tastiera a schermo' : 'tastiera') + ' le parole dei fumetti\nper distruggere i mostri prima che ti raggiungano', 50, '#2a1d14'),
      tx(30, '2.  Hai sbagliato frase? Premi ' + (window.TouchUI && TouchUI.touch ? '⌫' : 'BACKSPACE (la freccia ←)') + '\nper lasciare quel mostro e scriverne un altro', 50, '#2a1d14'),
      tx(170, '3.  Quando il boss crolla a terra:\n' + (window.TouchUI && TouchUI.touch ? 'TOCCA lo schermo o premi SPARA' : 'CLIC SINISTRO del mouse') + ' per sparargli l’inchiostro blu', 50, '#2a1d14')]);

  bossMsg(s, ms) {
    this.tweens.killTweensOf(this.bmsg);
    this.bmsg.setText(s).setAlpha(1);
    this.tweens.add({ targets: this.bmsg, alpha: 0, delay: ms - 700, duration: 700 });
  }

  bossWave() {
    const B = this.bs; B.ph = 'def'; B.spawned = 0; B.next = 1; B.count = 6 + 2 * Math.min(B.wave, 3);
    this.bossMsg(B.wave < 4 ? 'ONDATA ' + (B.wave + 1) + ' / 4' : 'ONDATA FINALE', 2000);
  }

  bossSpawn() {
    const B = this.bs, K = B.K, w = Math.min(B.wave, 3), air = Math.random() < 0.5, P = BWORDS[w];
    const near = (x) => B.mins.some(o => !o.dying && o.air === air && Math.abs(o.x - x) < (air ? 220 : 340));   // distanza minima: i fumetti non si sovrappongono
    let sx = null;
    for (let tr = 0; tr < 8 && sx === null; tr++) {
      const inside = !air && Math.random() < 0.45 + 0.1 * w;                          // i mostri di terra a volte nascono dentro la stanza, più vicini all'omino
      const x = (air ? 920 : inside ? Phaser.Math.FloatBetween(650, 960) : 1040) * K; if (!near(x)) sx = x;
    }
    if (sx === null) return false;                                                    // nessun posto libero: riprova tra poco
    const m = { air, id: (B.idc = (B.idc || 0) + 1), off: undefined, x: sx, by: Phaser.Math.FloatBetween(300, 400) * K, y: 0, t: Math.random() * 6, x0: 0, p: 0, sp: (air ? 125 : 95) + 18 * w, w: this.bossWord(w), n: 0, err: 0, dying: false, dt: 0 };
    m.x0 = m.x; m.y = air ? m.by : B.FL;
    m.sc = air ? 0.42 : 0.4;
    m.spr = air ? this.add.sprite(m.x, m.y, 'enemy_crow', 'crow0_0').setScale(0.42).setDepth(8) : this.add.sprite(m.x, m.y, 'enemy_blob', 'blob1_0').setScale(0.4).setDepth(8);
    this.bsFrame(m.spr, air ? 'crow0_0' : 'blob1_0'); m.spr.setFlipX(true);
    const st = { fontFamily: 'Georgia, serif', fontStyle: 'italic', fontSize: '46px', color: '#111' };
    m.t2 = this.add.text(0, 0, m.w, st).setOrigin(0, 0.5).setDepth(16); m.tw = m.t2.width;
    m.t1 = this.add.text(0, 0, '', { ...st, color: '#1b2fe0' }).setOrigin(0, 0.5).setDepth(16);
    m.bg = this.add.graphics().setDepth(15);
    m.em = air ? 0 : 1.5; if (!air) { B.vort.push({ x: m.x, l: 1.8 }); m.spr.setScale(0.02).setAlpha(0); }
    B.mins.push(m); B.spawned++; return true;
  }

  bossWord(w) {                                                        // parole a mazzo mescolato: non si ripetono finché non sono finite tutte

  updateBoss(delta) {

    const e = Math.min(1, dt * 3.5); B.bx += (B.tx - B.bx) * e; B.by += (B.ty - B.by) * e;

      m.dt += dt; m.spr.setScale(m.sc * (1 + m.dt * 2)).setAlpha(Math.max(0, 1 - m.dt * 7));          // il mostro scoppia in inchiostro
      if (m.dt > 0.16) { m.spr.destroy(); B.mins.splice(B.mins.indexOf(m), 1); }

    if (live && B.ph === 'def') {

        }

        if (m.air) {                                                       // il corvo plana e poi scende in picchiata sull'omino

      }
