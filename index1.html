    if (a === 'wipe') { Save.clear(); refreshContinue(); flash('Partita cancellata'); }
  });
  panel.addEventListener('input', (e) => {
    const k = e.target.dataset.pref; if (!k) return;
    const val = parseInt(e.target.value, 10) / 100;
    if (k === 'music') Snd.setMusicVol(val); else Snd.setSfxVol(val);
    applyVideoVol(); if (k === 'sfx') Snd.jump();           // piccolo beep di prova
  });

  /* ---------- voci del menu ---------- */
  const ACT = {
    new() { Save.clear(); startGame(1, 4); },
    cont() { const sv = Save.get(); if (!sv || !LEVELS[sv.level]) { flash('Nessuna partita da riprendere'); return; } startGame(sv.level, sv.lives || 4); },
    opts() { openPanel('opts'); },
    help() { openPanel('help'); },
    levels() { openPanel('levels'); }
  };
  menu.querySelectorAll('.mi').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); if (menuReady && !gameStarted) ACT[b.dataset.act](); }));
  menu.addEventListener('pointerdown', (e) => e.stopPropagation());

  // torna al libro con il menu (usato dal game over): niente video, solo l'immagine del menu
  window.showMenu = () => {
    gameStarted = false; menuReady = false; closePanel(); v.pause();
    menu.classList.remove('on');
    wrap.style.display = 'flex'; wrap.style.opacity = '0';
    requestAnimationFrame(() => { fit(); menuOn(); wrap.style.opacity = '1'; });
  };
  const toEnd = () => { if (!isFinite(v.duration)) { menuOn(); return; } v.currentTime = Math.max(0, v.duration - 0.05); v.pause(); menuOn(); };
  v.src = 'assets/intro.mp4';                                     // <- il video finisce sul menu: basta sostituire il file
  v.addEventListener('timeupdate', () => { if (isFinite(v.duration) && v.currentTime >= v.duration - 1.3) menuOn(); });
  v.addEventListener('ended', menuOn);
  v.addEventListener('error', () => { menuOn(); });
  skip.addEventListener('click', (e) => { e.stopPropagation(); toEnd(); });
  um.addEventListener('click', (e) => { e.stopPropagation(); applyVideoVol(); um.style.display = 'none'; });
  wrap.addEventListener('pointerdown', () => { if (!menuReady) toEnd(); });
  document.addEventListener('keydown', (e) => {
    if (gameStarted) return;
    if (e.key === 'Enter') { if (menuReady) { if (!panel.classList.contains('open')) ACT.new(); } else toEnd(); }
    if (e.key === 'Escape') { if (panel.classList.contains('open')) closePanel(); else if (!menuReady) toEnd(); }
  });
  if (QS.get('level')) { wrap.style.display = 'none'; return; }   // ?level=N salta intro e menu (sviluppo)
  applyVideoVol();
  // Il video parte SEMPRE da solo. Si prova con l'audio; se il browser lo blocca (regola dei browser: serve un gesto
  // dell'utente) parte comunque muto e il suono si attiva al primo clic/tasto, senza saltare l'intro.
  let gestured = false, gating = false;
  const gate = document.getElementById('gate');
  const unmuteNow = () => { applyVideoVol(); um.style.display = 'none'; };
  const GEST = ['pointerdown', 'mousedown', 'touchstart', 'keydown'];
  const firstGesture = (e) => {
    if (gestured) return; gestured = true;
    GEST.forEach(ev => document.removeEventListener(ev, firstGesture, true));
    if (gating) {                                   // schermata d'avvio: il gesto sblocca l'audio e il video parte dall'inizio con il suono
      gating = false; if (e) e.stopPropagation();
      gate.classList.add('hide'); setTimeout(() => { gate.style.display = 'none'; }, 750);
      applyVideoVol(); v.currentTime = 0;
      const q = v.play(); if (q && q.catch) q.catch(() => { v.muted = true; const r = v.play(); if (r && r.catch) r.catch(() => menuOn()); });
      return;
    }
    if (v.muted) { unmuteNow(); if (e) e.stopPropagation(); }
  };
  GEST.forEach(ev => document.addEventListener(ev, firstGesture, true));
  const showGate = () => { gating = true; v.pause(); try { v.currentTime = 0; } catch (_) {} gate.style.display = 'flex'; };
  applyVideoVol();
  if (QS.get('gate') === '1') { showGate(); return; }            // ?gate=1 mostra sempre la schermata (per vederla/modificarla)
  const p = v.play();
  if (p && p.catch) p.catch(() => {
    // audio automatico bloccato dal browser: compare la schermata d'avvio (Chrome con audio già consentito non la mostra)
    showGate();
  });
})();

/* ======================================================================
   AUDIO: musichetta sintetizzata (stile anni '80, rilassante) diversa per ogni stanza + effetti sonori.
   Tutto generato con WebAudio: nessun file da caricare.  Tasto M = muto / audio.
   ====================================================================== */
const Snd = (() => {
  let ctx = null, master, musicBus, sfxBus, delay, timer = null, track = null, wanted = null, muted = false;
  let step = 0, nextT = 0, started = 0;
  const CH = { maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10], six: [0, 4, 7, 9], maj: [0, 4, 7], m: [0, 3, 7], sus: [0, 5, 7, 10] };
  // root = nota MIDI del basso (C2 = 36); prog = accordi [semitoni dalla root, tipo]; ogni accordo dura 1 battuta
  const TRACKS = {
    1: { bpm: 92, wave: 'triangle', arp: [0, 1, 2, 3, 2, 1, 2, 1], prog: [[12, 'maj7'], [9, 'm7'], [5, 'maj7'], [7, 'six']] },                   // Do maggiore, luminoso
    2: { bpm: 86, wave: 'square',   arp: [0, 2, 1, 3, 2, 3, 1, 2], prog: [[2, 'm7'], [10, 'maj7'], [5, 'maj7'], [0, 'six']] },                  // Re minore, malinconico
    3: { bpm: 80, wave: 'triangle', arp: [3, 2, 1, 0, 1, 2, 3, 2], prog: [[9, 'm7'], [5, 'maj7'], [0, 'maj7'], [4, 'm7']] },                   // La minore, sognante
    4: { bpm: 90, wave: 'square',   arp: [0, 1, 3, 2, 0, 2, 3, 1], prog: [[7, 'six'], [4, 'm7'], [9, 'm7'], [2, 'sus']] },
    5: { bpm: 84, wave: 'triangle', arp: [0, 2, 3, 2, 1, 2, 3, 1], prog: [[5, 'maj7'], [7, 'six'], [4, 'm7'], [9, 'm7']] },
    6: { bpm: 96, wave: 'square',   arp: [0, 1, 2, 1, 3, 2, 1, 2], prog: [[9, 'm'], [5, 'maj'], [0, 'maj'], [7, 'maj']] }
  };
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function ensure() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = Prefs.get().muted ? 0 : 0.55; master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.32 * Prefs.get().music; musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.7 * Prefs.get().sfx; sfxBus.connect(master);
    delay = ctx.createDelay(1); delay.delayTime.value = 0.33;                       // eco tipico anni '80
    const fb = ctx.createGain(); fb.gain.value = 0.32; delay.connect(fb); fb.connect(delay);
    const dl = ctx.createGain(); dl.gain.value = 0.35; delay.connect(dl); dl.connect(musicBus);
    return true;
  }
  function env(g, t, a, peak, d, end) {
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(type, f, t, a, peak, d, dest, opts = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (opts.detune) o.detune.value = opts.detune;
    env(g, t, a, peak, d);
    let node = g;
    if (opts.lp) { const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = opts.lp; o.connect(lp); lp.connect(g); }
    else o.connect(g);
    g.connect(dest); if (opts.send) { const sg = ctx.createGain(); sg.gain.value = opts.send; g.connect(sg); sg.connect(delay); }
    o.start(t); o.stop(t + a + d + 0.05);
  }
  function noise(t, dur, peak, dest, hp = 6000, lpSweep) {
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur)), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = lpSweep ? 'lowpass' : 'highpass'; f.frequency.value = lpSweep ? lpSweep[0] : hp;
    if (lpSweep) f.frequency.exponentialRampToValueAtTime(lpSweep[1], t + dur);
    const g = ctx.createGain(); env(g, t, 0.005, peak, dur);
    src.connect(f); f.connect(g); g.connect(dest); src.start(t);
  }

  function scheduleStep(i, t, tr) {
    const spb = 60 / tr.bpm, s16 = spb / 4, bar = Math.floor(i / 16), k = i % 16;
    const [rootOff, type] = tr.prog[bar % tr.prog.length], chord = CH[type], base = 36 + rootOff;   // basso grave
    if (k === 0) {                                                  // pad: accordo lungo e morbido
      chord.forEach((n, j) => {
        const m = base + 24 + n;
        tone('sawtooth', mtof(m), t, 0.9, 0.05, spb * 4, musicBus, { lp: 900, detune: (j - 1.5) * 6, send: 0.15 });
      });
    }
    if (k === 0 || k === 8) tone('triangle', mtof(base), t, 0.01, 0.34, spb * 1.6, musicBus, { lp: 500 });       // basso
    if (k === 6 || k === 14) tone('triangle', mtof(base + (chord[2])), t, 0.01, 0.16, spb * 0.5, musicBus, { lp: 500 });
    if (k % 2 === 0) {                                              // arpeggio ottavi
      const idx = tr.arp[(k / 2) % 8], oct = 48 + (idx >= chord.length ? 12 : 0);
      const m = base + oct + chord[idx % chord.length];
      tone(tr.wave, mtof(m), t, 0.005, 0.11, spb * 0.55, musicBus, { lp: 2400, send: 0.45 });
    }
    if (k === 0 || k === 8) noise(t, 0.12, 0.10, musicBus, 0, [220, 60]);       // cassa morbida
    if (k === 4 || k === 12) noise(t, 0.14, 0.05, musicBus, 1800);               // rullante leggero
    if (k % 4 === 2) noise(t, 0.04, 0.025, musicBus, 7500);                      // charleston
  }
  function tick() {
    if (!ctx || !track || ctx.state !== 'running') return;
    const s16 = 60 / track.bpm / 4;
    if (nextT < ctx.currentTime) nextT = ctx.currentTime + 0.05;
    while (nextT < ctx.currentTime + 0.3) { scheduleStep(step, nextT, track); nextT += s16; step++; }
  }
  function begin() {
    if (!ctx || wanted == null) return;
    if (started === wanted) return;
    started = wanted; track = TRACKS[wanted] || TRACKS[((wanted - 1) % 6) + 1]; step = 0; nextT = 0;
    if (!timer) timer = setInterval(tick, 60);
  }
  function unlock() {
    if (!ensure()) return;
    if (ctx.state !== 'running') ctx.resume().then(begin).catch(() => {}); else begin();
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, unlock, true));
  window.addEventListener('keydown', (e) => {
    if (e.key === 'm' || e.key === 'M') api.setMuted(!Prefs.get().muted);
  });
  const can = () => ctx && ctx.state === 'running';

  const api = {
    unlock,
    setMuted(b) { Prefs.set('muted', !!b); if (master) master.gain.value = b ? 0 : 0.55; },
    setMusicVol(x) { Prefs.set('music', x); if (musicBus) musicBus.gain.value = 0.32 * x; },
    setSfxVol(x) { Prefs.set('sfx', x); if (sfxBus) sfxBus.gain.value = 0.7 * x; },
    stop() { wanted = null; started = 0; track = null; },
    music(id) { wanted = id; if (ctx) begin(); },                      // se la stessa stanza riparte (R) la musica continua senza stacchi
    jump() { if (!can()) return; const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(680, t + 0.12);
      env(g, t, 0.005, 0.12, 0.13); o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.2); },
    stomp() { if (!can()) return; const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(110, t + 0.16);
      env(g, t, 0.003, 0.2, 0.17); o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.25); noise(t, 0.12, 0.12, sfxBus, 0, [3000, 300]); },
    hurt() { if (!can()) return; const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.3);
      env(g, t, 0.005, 0.25, 0.32); o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.4); noise(t, 0.2, 0.12, sfxBus, 0, [2500, 200]); },
    splash() { if (!can()) return; noise(ctx.currentTime, 0.5, 0.3, sfxBus, 0, [2500, 150]); },
    ink() { if (!can()) return; const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.18);
      env(g, t, 0.01, 0.2, 0.25); o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.35); },
    door() { if (!can()) return; const t = ctx.currentTime; [72, 76, 79, 84].forEach((m, i) => tone('triangle', mtof(m), t + i * 0.12, 0.01, 0.22, 0.6, sfxBus, { send: 0.3 })); },
    appear() { if (!can()) return; const t = ctx.currentTime;                         // compare una scala: rombo di pietra + colpi + arpeggio ascendente
      noise(t, 1.3, 0.35, sfxBus, 0, [500, 50]);
      [0, 0.2, 0.4, 0.6].forEach(d => noise(t + d, 0.18, 0.22, sfxBus, 0, [1200, 150]));
      [60, 64, 67, 72, 76, 79].forEach((m, i) => tone('triangle', mtof(m), t + 0.5 + i * 0.11, 0.01, 0.25, 0.7, sfxBus, { send: 0.35 })); }
  };
  return api;
})();

class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }
  create() {
    const lv = parseInt(QS.get('level'), 10);
    if (lv) { this.scene.start('Level', { level: lv }); return; }
    window.beginGame = (level, lives) => this.scene.start('Level', { level: level || 1, lives: lives });
    if (window.__pendingGame) { const pg = window.__pendingGame; window.__pendingGame = null; window.beginGame(pg.level, pg.lives); }
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W, height: H,
  backgroundColor: '#f6e6cc',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: { default: 'arcade', arcade: { gravity: { y: C.gravity }, debug: false } },
  scene: [BootScene, LevelScene]
});
</script>
